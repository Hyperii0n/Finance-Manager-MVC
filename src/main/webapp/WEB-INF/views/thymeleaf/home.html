<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.2.0/css/bootstrap.min.css}"/>

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <link rel="stylesheet" href="/src/main/webapp/resources/core/css/main.css">
  <link rel="stylesheet" href="/src/main/webapp/resources/core/css/home.css">


</head>

<body>

  <div id="home-container">

    <aside>
      
      <div id="div-icon" class="aside-child">
        <img th:src="@{/img/nombre-foto.jpg}" src="/src/main/webapp/img/icon-financa-manager.png"  alt="Mi Foto" width="75px" />
        <h1>Hyperion</h1>
      </div>

      <nav id="nav" class="aside-child">
        <a href="">Inicio</a>
        <a href="">Mis movimientos</a>
        <a href="">Categorias</a>
        <a href="">Perfil</a>
      </nav>
      
      <div id="div-logout">
        <button>
          Cerrar Sesión
        </button>
      </div>

    </aside>

    <main>

      <header>
        <div id="header-div-user">
          <p>Hola,<span> Franco </span></p>
          <img th:src="@{/img/nombre-foto.jpg}" src="/src/main/webapp/img/user.jpg"  alt="Mi Foto" width="40px" />
        </div>

        <div id="header-div-new-operation">
          <h2>Overview</h2>
          <div>
            <button>+ New Operation</button>
          </div>
        </div>
      </header>

      <section id="overview">

        <article class="overview-targets">
          <h3>Saldo total</h3>
          <p>$100,000</p>
        </article>

        <article class="overview-targets">
          <h3>Ingresos del mes</h3>
          <p>$120,000</p>  
        </article>
        
        <article class="overview-targets">
          <h3>Gastos del mes</h3>
          <p>$20,000</p>
        </article>

      </section>

  <section id="charts">
    
    <div class="chart-container" id="chart-container-columns">
        <div class="chart-card">
            <h2>Evolución Semestral</h2>
            <div class="chart-wrapper">
                <canvas id="columns"></canvas>
            </div>
        </div>
    </div>

    <div class="chart-container" id="chart-container-doughnut">
        <div class="chart-card">
            <h2>Gastos por Categoría</h2>
            <div class="chart-wrapper">
                <canvas id="doughnut"></canvas>
            </div>
        </div>
    </div>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="text/javascript" th:src="@{webjars/bootstrap/5.2.0/js/bootstrap.min.js}"></script>
<script type="text/javascript" th:src="@{/js/home.js}"></script>
<script type="text/javascript" src="/src/main/webapp/resources/core/js/home.js"></script>
</body>
</html>
